services:
  postgres:
    image: postgres:15-alpine
    container_name: taskgroup_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: luis.gf
      POSTGRES_PASSWORD: provisional
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"luis.gf\" -d postgres"]
      interval: 30s
      timeout: 10s
      retries: 3

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskgroup_api
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: postgres
      DB_USERNAME: luis.gf
      DB_PASSWORD: provisional
      APP_ENV: local
      APP_DEBUG: "true"
    ports:
      - "8081:80"
    volumes:
      - ./backend:/var/www/html
    command: >
      sh -c "
        php artisan config:clear &&
        php artisan migrate --force &&
        apache2-foreground
      "

  frontend:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: taskgroup_frontend
    depends_on:
      - api
    ports:
      - "4200:4200"
    volumes:
      - ./app:/app
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    command: >
      npm run start -- --host 0.0.0.0 --port 4200 --proxy-config proxy.docker.conf.json

volumes:
  pgdata:
    driver: local
